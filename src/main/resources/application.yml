spring:
  application:
    name: Unified Event Analytics Engine  

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}   # Use your Railway DB password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}       # Use your Railway Redis password if any
      ssl:
        enabled: false
      repositories:
        enabled: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

management:
  server:
    base-path: /
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always