spring:
  application:
    name: Unified Event Analytics Engine  

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # For production, consider 'validate' or 'none'
    show-sql: false           # Turn off SQL logging in prod
    database-platform: org.hibernate.dialect.MySQLDialect

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      repositories:
        enabled: false
      ssl:
        enabled: false         # Railway Redis does NOT need TLS

server:
  port: ${PORT:8080}         # Railway automatically sets PORT

logging:
  level:
    root: info               # Keep root logging at info level
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
